name: Build and deploy site to cloudflare

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      
      - name: Render website
        uses: quarto-dev/quarto-actions/render@v2

      - name: Install sequoia
        run: npm i -g sequoia-cli@0.5.7

      # Preview deploys are public, so they must not claim to be the canonical home of
      # a document record. Dry run keeps the step exercised on every PR all the same.
      - name: Check standard.site link tags
        if: github.ref != 'refs/heads/main'
        run: sequoia inject --output _site --dry-run

      - name: Inject standard.site link tags
        if: github.ref == 'refs/heads/main'
        run: sequoia inject --output _site

      - name: Publish to cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=jacobdawang
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
